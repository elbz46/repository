---
name: PeriphHub installer

# yamllint disable-line rule:truthy
on:
  push:
    paths:
      - "periphhub/**"
      - ".github/workflows/periphhub.yaml"
    tags:
      - "periphhub-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Build app and installer
        working-directory: periphhub
        run: ./build.sh
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PeriphHub-Setup
          path: periphhub/out/installer/*.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/periphhub-v')
        uses: softprops/action-gh-release@v2
        with:
          files: periphhub/out/installer/*.exe
